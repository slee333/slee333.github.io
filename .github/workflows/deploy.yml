name: Build and Deploy Jekyll to /docs folder

on:
  push:
    branches:
      - gh-pages  # You are using the gh-pages branch for both source and deployment

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the gh-pages branch where your Jekyll source code is
      - name: Checkout code
        uses: actions/checkout@v3  # Upgraded to v3 to fix Node.js warning
        with:
          ref: gh-pages  # Check out the gh-pages branch as your source branch

      # Step 2: Set up Ruby environment for Jekyll
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '2.7'  # Set Ruby version explicitly

      # Step 3: Install Bundler and Jekyll (to avoid version mismatch issues)
      - name: Install Bundler
        run: gem install bundler

      - name: Install Jekyll
        run: gem install jekyll

      # Step 4: Install dependencies from Gemfile
      - name: Install dependencies
        run: bundle install

      # Step 5: Replace the placeholder with the actual web app URL stored in GitHub Secrets
      - name: Replace web app URL in config
        run: |
          sed -i "s|PLACEHOLDER_WEB_APP_URL|${{ secrets.WEB_APP_URL }}|" _config.yml

      # Step 6: Build the Jekyll site (output static files to ./build)
      - name: Build Jekyll site
        run: bundle exec jekyll build --destination ./build

      # Step 7: Deploy the built site to the /docs folder in the gh-pages branch
      - name: Deploy to /docs folder
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./build
          destination_dir: docs
