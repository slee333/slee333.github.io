# Build settings
theme: minima
plugins:
  - jekyll-feed
  - jekyll-sitemap

# multi language settings

# hreflang 태그 생성을 위한 간단한 언어 목록
languages_list: ["kr", "en", "es"]

# 기본 언어 설정
default_lang: "kr"

languages: 
  kr: 
    permalink: /:title/
    default_lang: true
  en: 
    permalink: /en/:title/
  es: 
    permalink: /es/:title/

