<div class="sticky-header">
    <div class="wrapper">
        <a class="page-link site-title"
            href="{% if page.lang == 'kr' %}{{ site.baseurl }}/{% else %}{{ site.baseurl }}/{{ page.lang }}/{% endif %}">{{
            site.title }}</a>
        <div class="current-page-details">
            <div class="current-page-title">{{ page.title }}</div>
            <div class="current-page-headings">
                <div class="current-page-section" id="current-section-h1"></div>
                <div class="current-page-section" id="current-section-h2"></div>
            </div>
        </div>
        <div class="language-switcher">
            <select id="language-select-sticky">
                <option value="kr" {% if page.lang=='kr' %}selected{% endif %}>한국어</option>
                <option value="en" {% if page.lang=='en' %}selected{% endif %}>English</option>
                <option value="es" {% if page.lang=='es' %}selected{% endif %}>Español</option>
            </select>
        </div>
    </div>
    <div class="progress-bar" id="progressBar"></div>
</div>


<script>
    // JavaScript for the progress bar
    window.onscroll = function () {
        scrollProgress();
    };
    function scrollProgress() {
        var winScroll =
            document.body.scrollTop || document.documentElement.scrollTop;
        var height =
            document.documentElement.scrollHeight -
            document.documentElement.clientHeight;
        var scrolled = (winScroll / height) * 100;
        document.getElementById("progressBar").style.width = scrolled + "%";
    };
    document.addEventListener('DOMContentLoaded', function () {

        const stickyLanguageSelect = document.getElementById('language-select-sticky');
        const stickyHeader = document.querySelector('.sticky-header');

        const currentSection_h1 = document.getElementById('current-section-h1');
        const currentSection_h2 = document.getElementById('current-section-h2');

        const headings = document.querySelectorAll('main .post-content h2');
        const headings1 = document.querySelectorAll('main .post-content h1');

        const showHeaderAt = 400; // Header visibility scroll distance (px)

        // Scroll position handling
        const scrollPositionKey = 'scrollPosition';

        function saveScrollPosition() {
            sessionStorage.setItem(scrollPositionKey, window.scrollY);
        }

        function restoreScrollPosition() {
            const scrollY = sessionStorage.getItem(scrollPositionKey);
            if (scrollY) {
                window.scrollTo(0, parseFloat(scrollY));
                sessionStorage.removeItem(scrollPositionKey);
            }
        }

        stickyLanguageSelect.addEventListener('change', function () {
            saveScrollPosition();
            redirectPage(this.value);
        });

        function redirectPage(selectedLang) {
            let currentUrl = window.location.pathname;

            // Remove existing language prefix
            if (currentUrl.startsWith('/en/') || currentUrl.startsWith('/es/')) {
                currentUrl = currentUrl.replace(/^\/(en|es)\//, '/');
            }

            // Add new language prefix if necessary
            if (selectedLang !== 'kr') {
                currentUrl = `/${selectedLang}${currentUrl}`;
            }

            // Clean up duplicate slashes
            currentUrl = currentUrl.replace(/\/+/g, '/');

            // Redirect to the new URL
            window.location.href = `${window.location.origin}${currentUrl}`;
        }

        // Restore scroll position after page load
        restoreScrollPosition();

        window.addEventListener('scroll', function () {
            if (window.scrollY > showHeaderAt) {
                stickyHeader.classList.add('visible');
            } else {
                stickyHeader.classList.remove('visible');
            }

            let currentHeading1 = '  ';
            let currentHeading2 = '  ';

            for (let i = 0; i < headings1.length; i++) {
                const heading = headings1[i];
                const rect = heading.getBoundingClientRect();
                const offsetTop = window.scrollY + rect.top;
                const offsetNextTop = (i === headings1.length - 1) ? document.documentElement.scrollHeight : window.scrollY + headings1[i + 1].getBoundingClientRect().top;

                if (window.scrollY >= offsetTop && window.scrollY < offsetNextTop) {
                    currentHeading1 = heading.textContent;
                    break;
                }
            }

            for (let i = 0; i < headings.length; i++) {
                const heading = headings[i];
                const rect = heading.getBoundingClientRect();
                const offsetTop = window.scrollY + rect.top;
                const offsetNextTop = (i === headings.length - 1) ? document.documentElement.scrollHeight : window.scrollY + headings[i + 1].getBoundingClientRect().top;

                if (window.scrollY >= offsetTop && window.scrollY < offsetNextTop) {
                    currentHeading2 = heading.textContent;
                    break;
                }

                lastHeading = heading.textContent;
            }

            currentSection_h1.textContent = currentHeading1;
            currentSection_h2.textContent = currentHeading2;

            if (currentHeading1 !== '  ' && currentHeading2 !== '  ') {
                currentSection_h1.textContent += "   /   ";
            }

        });
    });
</script>
