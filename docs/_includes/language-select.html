{%- comment -%}
  Language <select>. Usage: {% include language-select.html id="language-select" class="language-switcher" %}
{%- endcomment -%}
<div class="{{ include.class | default: 'language-switcher' }}">
  <label class="sr-only" for="{{ include.id }}">{{ site.data.phrases[page.lang]["navbar"]["language_label"] | default: 'Language' }}</label>
  <select id="{{ include.id }}" data-language-select>
    <option value="kr" {% if page.lang == 'kr' %}selected{% endif %}>한국어</option>
    <option value="en" {% if page.lang == 'en' %}selected{% endif %}>English</option>
    <option value="es" {% if page.lang == 'es' %}selected{% endif %}>Español</option>
  </select>
</div>
