---
layout: base
---

<article class="category-page">
  <header class="category-page-header">
    <h1 class="category-page-title">{{ page.title }}</h1>
  </header>

  <div class="category-page-content">{{ content }}</div>

  <div class="category-page-posts">
    <h2>{{site.data.phrases[page.lang]["postsinthiscategory"]}}</h2>

    {% for post in site.categories[page.categories] %} 
    {% if post.lang == page.lang %}

    <div class="category-post" onclick="window.location.href='{{ post.url }}'">
      <div class="category-post-thumbnail">
        <img src="{{ post.thumbnail }}" alt="{{ post.title }}" />
      </div>
      <div class="category-post-content">
        <h2>{{ post.title }}</h2>
        <p>{{ post.subtitle }}</p>
      </div>
    </div>
    {% endif %} {% endfor %}
  </div>
</article>
